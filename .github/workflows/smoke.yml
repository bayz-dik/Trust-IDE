name: Trust IDE Smoke Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check server/index.js
          node --check server/agents.js
          node --check tests/smoke.test.mjs
      - name: Test mobile server
        run: node --test tests/smoke.test.mjs
