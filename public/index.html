<!doctype html><html lang="id"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trust IDE</title><style>body{background:#111827;color:#f3f4f6;font-family:system-ui;margin:18px}textarea,select,input{box-sizing:border-box;width:100%;background:#1f2937;color:white;border:1px solid #4b5563;border-radius:8px;padding:12px;margin:7px 0}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px;margin:5px}pre{white-space:pre-wrap;background:#0b1220;padding:12px;border-radius:8px;max-height:260px;overflow:auto}</style><h2>Trust IDE Mobile</h2><small>Mobile coding prototype · OMP + Codex · APK build</small><h3>AI Agent</h3><select id="agent"><option value="omp">Oh My Pi</option><option value="codex">Codex</option></select><textarea id="prompt" rows="5" placeholder="Tugas coding untuk agent"></textarea><button onclick="call('/api/run',{agent:agent.value,prompt:prompt.value})">Run Agent</button><h3>Editor manual</h3><input id="path" placeholder="File path in workspace, e.g. README.md"><button onclick="load()">Open</button><textarea id="editor" rows="12" spellcheck="false" placeholder="Source code"></textarea><button onclick="save()">Save File</button><h3>Build Android APK</h3><button onclick="call('/api/build',{})">Build APK</button><button onclick="status()">Refresh Log</button><pre id="log">Ready</pre><script>async function req(url,opts){const r=await fetch(url,opts);const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}async function call(url,b){try{log.textContent=JSON.stringify(await req(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}))}catch(e){log.textContent=e.message}}async function load(){try{editor.value=(await req('/api/file?path='+encodeURIComponent(path.value))).content}catch(e){log.textContent=e.message}}async function save(){try{log.textContent=JSON.stringify(await req('/api/file',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({path:path.value,content:editor.value})}))}catch(e){log.textContent=e.message}}async function status(){try{const v=await req('/api/status');log.textContent=v.events.join('\n').slice(-12000)}catch(e){log.textContent=e.message}}setInterval(status,5000);</script></html>
